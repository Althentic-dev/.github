name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (blue Althentic theme)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Althentic-dev
          outputs: |
            dist/snake.svg?color_snake=%233b82f6&color_dots=%231e3a8a,%232563eb,%2360a5fa,%2393c5fd
            dist/snake-dark.svg?palette=github-dark&color_snake=%2360a5fa
            dist/snake.gif?color_snake=%233b82f6&color_dots=%231e3a8a,%232563eb,%2360a5fa,%2393c5fd

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
